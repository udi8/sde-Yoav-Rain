<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 320" role="img" aria-label="איור: טרקטור ישן חורש שדה בגשם, אנפות לבנות בתלמים, גבעות וחורשת אקליפטוסים ברקע">
      <style>
.rain line{stroke:#5B5949;stroke-width:1.1;stroke-linecap:round;opacity:.42;stroke-dasharray:9 31;animation:fall .75s linear infinite}
.rain line:nth-child(3n){opacity:.24;stroke-dasharray:6 34;animation-duration:1.05s}
.rain line:nth-child(3n+1){stroke-dasharray:12 28;animation-duration:.6s}
@keyframes fall{to{stroke-dashoffset:-40}}
.bob{animation:bob .45s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-0.8px)}}
@media (prefers-reduced-motion:reduce){.rain line,.bob{animation:none}}
</style>
      <defs>
